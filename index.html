<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor AR - Medidas Reales</title>
  
  <!-- Importamos la librería de model-viewer (Versión estable más reciente) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #e5e5e5;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #contenedor-ar {
      position: relative;
      width: 100%;
      height: 100%;
    }
    
    model-viewer {
      width: 100%;
      height: 100%;
      /* Ocultamos el botón por defecto para evitar conflictos en Android */
      --ar-button-display: none; 
    }

    /* Botón flotante profesional */
    #ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #212121;
      color: white;
      border-radius: 30px;
      border: none;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1000;
      transition: background-color 0.3s;
    }

    #ar-button:active {
      background-color: #424242;
    }

    /* Estilos para las etiquetas flotantes de medidas (en mm) */
    .medida-label {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      color: #111;
      display: block;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 10px;
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      border: 1px solid rgba(0,0,0,0.1);
    }

    /* Puntos invisibles para calcular las posiciones 3D en pantalla */
    .punto-anclaje {
      display: block;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* Capa para dibujar las líneas vectoriales */
    #lineas-ejes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .linea-eje {
      stroke-width: 2.5;
      stroke-dasharray: 5, 5;
      opacity: 0.8;
    }
    
    /* Colores clásicos de software 3D para rápida identificación */
    #linea-x { stroke: #ff3333; } /* X: Ancho (Rojo) */
    #linea-y { stroke: #33cc33; } /* Y: Alto (Verde) */
    #linea-z { stroke: #3366ff; } /* Z: Profundidad (Azul) */
  </style>
</head>
<body>

  <div id="contenedor-ar">
    
    <!-- 
      CONFIGURACIÓN CLAVE:
      1. ar-modes="scene-viewer webxr quick-look" -> Obliga a Android a usar la app nativa de cámara, evitando bloqueos.
      2. camera-orbit="45deg 55deg auto" -> Inicia el modelo en diagonal para que el eje Z (profundidad) no quede oculto.
      3. ios-src -> Listo para cuando conviertas el archivo a .usdz para usuarios de Apple.
    -->
    <model-viewer id="visor-3d" 
                  src="tu_modelo.glb" 
                  ios-src="tu_modelo.usdz"
                  ar 
                  ar-modes="scene-viewer webxr quick-look" 
                  camera-controls 
                  camera-orbit="45deg 55deg auto"
                  shadow-intensity="1.5"
                  exposure="1"
                  alt="Modelo 3D Interactivo">
      
      <!-- Botón de AR personalizado -->
      <button slot="ar-button" id="ar-button">
        📍 Ver en mi espacio (AR)
      </button>

      <!-- Anclajes atados a la geometría del modelo -->
      <button slot="hotspot-origen" class="punto-anclaje" data-position="0 0 0"></button>
      <button slot="hotspot-x" class="punto-anclaje" data-position="0 0 0"></button>
      <button slot="hotspot-y" class="punto-anclaje" data-position="0 0 0"></button>
      <button slot="hotspot-z" class="punto-anclaje" data-position="0 0 0"></button>
    </model-viewer>

    <!-- Textos de las cotas -->
    <div id="etiqueta-x" class="medida-label"></div>
    <div id="etiqueta-y" class="medida-label"></div>
    <div id="etiqueta-z" class="medida-label"></div>

    <!-- Líneas de cotas -->
    <svg id="lineas-ejes">
      <line id="linea-x" class="linea-eje"></line>
      <line id="linea-y" class="linea-eje"></line>
      <line id="linea-z" class="linea-eje"></line>
    </svg>

  </div>

  <script>
    const viewer = document.querySelector('#visor-3d');
    
    const anclajeOrigen = viewer.querySelector('[slot="hotspot-origen"]');
    const anclajeX = viewer.querySelector('[slot="hotspot-x"]');
    const anclajeY = viewer.querySelector('[slot="hotspot-y"]');
    const anclajeZ = viewer.querySelector('[slot="hotspot-z"]');
    
    const etiquetaX = document.querySelector('#etiqueta-x');
    const etiquetaY = document.querySelector('#etiqueta-y');
    const etiquetaZ = document.querySelector('#etiqueta-z');
    
    const lineaX = document.querySelector('#linea-x');
    const lineaY = document.querySelector('#linea-y');
    const lineaZ = document.querySelector('#linea-z');

    let modeloCargado = false;

    // Se ejecuta en cuanto el archivo 3D termina de descargar y procesarse
    viewer.addEventListener('load', () => {
      
      const initMedidas = () => {
        const medidas = viewer.getDimensions();
        const centro = viewer.getBoundingBoxCenter();

        // Validamos si el motor de renderizado ya calculó el volumen real del objeto
        if (medidas.x === 0 && medidas.y === 0 && medidas.z === 0) {
          setTimeout(initMedidas, 150); // Reintenta si aún está en 0
          return;
        }

        modeloCargado = true;

        // Se multiplican los metros por 1000 para trabajar en milímetros exactos
        etiquetaX.textContent = `Ancho: ${(medidas.x * 1000).toFixed(1)} mm`;
        etiquetaY.textContent = `Alto: ${(medidas.y * 1000).toFixed(1)} mm`;
        etiquetaZ.textContent = `Prof.: ${(medidas.z * 1000).toFixed(1)} mm`;

        // Posicionamiento de las esquinas basado en la caja delimitadora (Bounding Box)
        const origX = centro.x - (medidas.x / 2);
        const origY = centro.y - (medidas.y / 2);
        const origZ = centro.z - (medidas.z / 2);

        // Fijamos los puntos en el espacio 3D
        anclajeOrigen.setAttribute('data-position', `${origX} ${origY} ${origZ}`);
        anclajeX.setAttribute('data-position', `${origX + medidas.x} ${origY} ${origZ}`);
        anclajeY.setAttribute('data-position', `${origX} ${origY + medidas.y} ${origZ}`);
        anclajeZ.setAttribute('data-position', `${origX} ${origY} ${origZ + medidas.z}`);
        
        // Hacemos visibles las etiquetas suavemente
        etiquetaX.style.opacity = 1;
        etiquetaY.style.opacity = 1;
        etiquetaZ.style.opacity = 1;

        // Renderizamos las líneas por primera vez
        setTimeout(actualizarLineas, 100);
      };

      initMedidas();
    });

    // Esta función traduce las coordenadas 3D a coordenadas 2D en tu pantalla
    const actualizarLineas = () => {
      if (!modeloCargado) return;

      const rectOrigen = anclajeOrigen.getBoundingClientRect();
      const rectX = anclajeX.getBoundingClientRect();
      const rectY = anclajeY.getBoundingClientRect();
      const rectZ = anclajeZ.getBoundingClientRect();
      const visorRect = viewer.getBoundingClientRect();

      // Calcula el centro exacto del elemento en relación a la pantalla
      const getCentro = (rect) => ({
        x: rect.left - visorRect.left + (rect.width / 2),
        y: rect.top - visorRect.top + (rect.height / 2)
      });

      const pOrigen = getCentro(rectOrigen);
      const pX = getCentro(rectX);
      const pY = getCentro(rectY);
      const pZ = getCentro(rectZ);

      // Usamos requestAnimationFrame para que las líneas sigan al modelo a 60fps sin tirones
      requestAnimationFrame(() => {
        // Eje X
        lineaX.setAttribute('x1', pOrigen.x);
        lineaX.setAttribute('y1', pOrigen.y);
        lineaX.setAttribute('x2', pX.x);
        lineaX.setAttribute('y2', pX.y);
        etiquetaX.style.left = `${(pOrigen.x + pX.x) / 2}px`;
        etiquetaX.style.top = `${(pOrigen.y + pX.y) / 2}px`;

        // Eje Y
        lineaY.setAttribute('x1', pOrigen.x);
        lineaY.setAttribute('y1', pOrigen.y);
        lineaY.setAttribute('x2', pY.x);
        lineaY.setAttribute('y2', pY.y);
        etiquetaY.style.left = `${(pOrigen.x + pY.x) / 2}px`;
        etiquetaY.style.top = `${(pOrigen.y + pY.y) / 2}px`;

        // Eje Z
        lineaZ.setAttribute('x1', pOrigen.x);
        lineaZ.setAttribute('y1', pOrigen.y);
        lineaZ.setAttribute('x2', pZ.x);
        lineaZ.setAttribute('y2', pZ.y);
        etiquetaZ.style.left = `${(pOrigen.x + pZ.x) / 2}px`;
        etiquetaZ.style.top = `${(pOrigen.y + pZ.y) / 2}px`;
      });
    };

    // Repintar las líneas cada vez que el cliente gira el modelo o cambia el tamaño de la ventana
    viewer.addEventListener('camera-change', actualizarLineas);
    window.addEventListener('resize', actualizarLineas);
  </script>
</body>
</html>
